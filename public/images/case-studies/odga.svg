<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" fill="none">
  <defs>
    <linearGradient id="bg-odga" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071739"/>
      <stop offset="50%" stop-color="#0c34cd"/>
      <stop offset="100%" stop-color="#040e24"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bg-odga)"/>
  <rect width="800" height="480" fill="url(#grid)"/>

  <!-- Decorative Glows -->
  <circle cx="700" cy="100" r="180" fill="#00d2ff" fill-opacity="0.15" filter="blur(60px)"/>
  <circle cx="100" cy="400" r="160" fill="#0c34cd" fill-opacity="0.4" filter="blur(50px)"/>

  <!-- Top Badge -->
  <g transform="translate(50, 48)">
    <rect width="320" height="34" rx="17" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="1" stroke-opacity="0.25"/>
    <circle cx="18" cy="17" r="5" fill="#00ffcc"/>
    <text x="32" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#ffffff" letter-spacing="1.5">COMMONWEALTH OF VIRGINIA • ODGA</text>
  </g>

  <!-- Big Title -->
  <text x="50" y="135" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" fill="#ffffff" letter-spacing="-0.5">
    State Agency Portal Modernization
  </text>
  <text x="50" y="172" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="17" fill="#93c5fd">
    Unified NIST-Compliant GovCloud Architecture &amp; Database Replication
  </text>

  <!-- Visual Central Graphic: GovCloud Node Mesh -->
  <g transform="translate(50, 215)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="215" height="135" rx="18" fill="url(#card-grad)" stroke="#ffffff" stroke-width="1" stroke-opacity="0.18"/>
    <text x="24" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#38bdf8">&lt; 2.5s</text>
    <text x="24" y="74" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#ffffff" letter-spacing="1">DATA SYNC LATENCY</text>
    <text x="24" y="100" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="11" fill="#94a3b8">Real-time state DB sync</text>

    <!-- Card 2 -->
    <rect x="235" y="0" width="215" height="135" rx="18" fill="url(#card-grad)" stroke="#ffffff" stroke-width="1" stroke-opacity="0.18"/>
    <text x="259" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#4ade80">100%</text>
    <text x="259" y="74" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#ffffff" letter-spacing="1">SECURITY AUDIT</text>
    <text x="259" y="100" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="11" fill="#94a3b8">NIST 800-53 Certified</text>

    <!-- Card 3 -->
    <rect x="470" y="0" width="230" height="135" rx="18" fill="url(#card-grad)" stroke="#ffffff" stroke-width="1" stroke-opacity="0.18"/>
    <text x="494" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#fbbf24">4M+</text>
    <text x="494" y="74" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#ffffff" letter-spacing="1">VIRGINIA CITIZENS</text>
    <text x="494" y="100" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="11" fill="#94a3b8">Daily public portal access</text>
  </g>

  <!-- Bottom Tagline -->
  <g transform="translate(50, 415)">
    <rect width="700" height="34" rx="8" fill="#000000" fill-opacity="0.3"/>
    <text x="20" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#e2e8f0">
      TECH STACK: AWS GovCloud • Next.js • TypeScript • PostgreSQL • Docker • Terraform
    </text>
  </g>
</svg>
