<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" fill="none">
  <defs>
    <linearGradient id="bg-usaid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071739"/>
      <stop offset="45%" stop-color="#002f6c"/>
      <stop offset="85%" stop-color="#0c34cd"/>
      <stop offset="100%" stop-color="#021029"/>
    </linearGradient>
    <linearGradient id="card-grad-u" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <pattern id="grid-u" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bg-usaid)"/>
  <rect width="800" height="480" fill="url(#grid-u)"/>

  <!-- Decorative Glows -->
  <circle cx="680" cy="120" r="200" fill="#38bdf8" fill-opacity="0.14" filter="blur(70px)"/>
  <circle cx="120" cy="380" r="150" fill="#002f6c" fill-opacity="0.4" filter="blur(50px)"/>

  <!-- Top Badge -->
  <g transform="translate(50, 48)">
    <rect width="320" height="34" rx="17" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="1" stroke-opacity="0.25"/>
    <circle cx="18" cy="17" r="5" fill="#38bdf8"/>
    <text x="32" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#ffffff" letter-spacing="1.5">USAID • GLOBAL HUMANITARIAN SYSTEMS</text>
  </g>

  <!-- Title -->
  <text x="50" y="135" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" fill="#ffffff" letter-spacing="-0.5">
    Global Mission Data Synchronization
  </text>
  <text x="50" y="172" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="17" fill="#93c5fd">
    Offline-First Geospatial Telemetry &amp; Field Aggregation Mesh
  </text>

  <!-- Metrics Grid -->
  <g transform="translate(50, 215)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="215" height="135" rx="18" fill="url(#card-grad-u)" stroke="#ffffff" stroke-width="1" stroke-opacity="0.18"/>
    <text x="24" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#38bdf8">99.98%</text>
    <text x="24" y="74" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#ffffff" letter-spacing="1">FIELD UPTIME</text>
    <text x="24" y="100" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="11" fill="#94a3b8">Continuous field ops</text>

    <!-- Card 2 -->
    <rect x="235" y="0" width="215" height="135" rx="18" fill="url(#card-grad-u)" stroke="#ffffff" stroke-width="1" stroke-opacity="0.18"/>
    <text x="259" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#4ade80">35+</text>
    <text x="259" y="74" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#ffffff" letter-spacing="1">GLOBAL MISSIONS</text>
    <text x="259" y="100" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="11" fill="#94a3b8">Across 4 continents</text>

    <!-- Card 3 -->
    <rect x="470" y="0" width="230" height="135" rx="18" fill="url(#card-grad-u)" stroke="#ffffff" stroke-width="1" stroke-opacity="0.18"/>
    <text x="494" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#fbbf24">0 LOSS</text>
    <text x="494" y="74" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#ffffff" letter-spacing="1">DATA INTEGRITY</text>
    <text x="494" y="100" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="11" fill="#94a3b8">3+ years running 100%</text>
  </g>

  <!-- Tech Strip -->
  <g transform="translate(50, 415)">
    <rect width="700" height="34" rx="8" fill="#000000" fill-opacity="0.3"/>
    <text x="20" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#e2e8f0">
      TECH STACK: Python • Kubernetes • Apache Kafka • PostgreSQL • React • Cloud Mesh
    </text>
  </g>
</svg>
